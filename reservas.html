  </header>

  <main>
    <section id="formularioReserva">
      <h2>Preencha os dados da viagem</h2>
      <form>

        <label>Nome completo:</label>
        <input type="text" id="nome" required>

        <label>Data de Partida:</label>
        <input type="date" id="dataPartida" required>

        <label>Destino:</label>
        <select id="destino" required>
          <option value="">Selecione</option>
          <option value="Rio de Janeiro" data-km="1160">Rio de Janeiro</option>
          <option value="Icaraí de Amontada" data-km="1770">Icaraí de Amontada</option>
          <option value="Nobres" data-km="1185">Nobres</option>
          <option value="Rio Grande do Sul" data-km="2022.3">Rio Grande do Sul</option>
          <option value="Jericoacoara" data-km="2096.4">Jericoacoara</option>
          <option value="Balneário Camboriú" data-km="1596.6">Balneário Camboriú</option>
          <option value="Veneza" data-km="7454">Veneza</option>
          <option value="Tokyo" data-km="16808">Tokyo</option>
          <option value="Moscou" data-km="11179">Moscou</option>
        </select>

        <label>Quantidade de passageiros:</label>
        <input type="number" id="passageiros" min="1" value="1" required>

        <label>Tipo de assento:</label>
        <select id="assento" required>
          <option value="">Selecione</option>
          <option value="padrao">Padrão</option>
          <option value="vip">VIP</option>
          <option value="executiva">Executiva</option>
        </select>

        <p id="assentosDisponiveis">Assentos disponíveis (Padrão): <strong>--</strong></p>

        <div id="simulacaoPreco">
        </div>


        <button type="submit" id="confirmar">Confirmar Reserva</button>
        <p id="erro" class="erro"></p>
      </form>
    </section>

    <section id="resultado" class="oculto"></section>
  </main>

  <footer>
    <p>Contato: contato@rota365.com | Tel: (61) 4002-8922</p>
    <p>Redes sociais: @Rota365</p>
    <p>Todos os Direitos reservados</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
